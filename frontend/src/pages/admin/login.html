<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NOVUS Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
    body{
 font-family:system-ui;
}

</style>
<body class="bg-[#020F18] text-white flex items-center justify-center h-screen">

<div class="bg-white/5 p-8 rounded-xl w-full max-w-md border border-white/10">

<h1 class="text-2xl font-bold text-neon mb-6">Admin Login</h1>

<input id="email" placeholder="Admin Email"
 class="w-full p-3 mb-4 bg-black/50 rounded"/>

<input id="password" type="password"
 placeholder="Password"
 class="w-full p-3 mb-6 bg-black/50 rounded"/>

<button onclick="login()"
 class="w-full bg-[#0AF748] text-black py-3 rounded font-bold">
Login
</button>

<p id="error" class="text-red-400 mt-4 text-sm"></p>

</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
