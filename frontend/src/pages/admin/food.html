<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Food Report</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#020F18] text-white p-6">

<h1 class="text-3xl text-[#0AF748] font-bold mb-6">
Food Arrangement Report
</h1>

<!-- TOTALS -->
<!-- FOOD SUMMARY CARDS -->
<div id="totals" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

  <div class="bg-white/5 border border-white/10 rounded-xl p-6 text-center">
    <p class="text-gray-400">Total Participants</p>
    <h2 id="totalMembers" class="text-4xl font-bold text-white mt-2">0</h2>
  </div>

  <div class="bg-green-500/10 border border-green-400/30 rounded-xl p-6 text-center">
    <p class="text-green-300">Vegetarian</p>
    <h2 id="totalVeg" class="text-4xl font-bold text-green-400 mt-2">0</h2>
  </div>

  <div class="bg-yellow-500/10 border border-yellow-400/30 rounded-xl p-6 text-center">
    <p class="text-yellow-300">Non‑Vegetarian</p>
    <h2 id="totalNonVeg" class="text-4xl font-bold text-yellow-400 mt-2">0</h2>
  </div>

</div>


<!-- TABLE -->
<table class="w-full border border-white/10 text-sm">
<thead class="bg-white/10">
<tr>
<th class="p-2">Team</th>
<th class="p-2">Leader</th>
<th class="p-2">Members</th>
<th class="p-2">Veg</th>
<th class="p-2">Non‑Veg</th>
</tr>
</thead>

<tbody id="foodTable"></tbody>
</table>

<script type="module" src="./js/food.js"></script>

</body>
</html>
