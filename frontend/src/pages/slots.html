<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NOVUS — Slots Filled</title>
<link rel="icon" href="public/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: system-ui;
    }
  </style>
</head>

<body class="bg-[#020F18] text-white min-h-screen">

  <!-- HEADER -->
  <header class="p-6 border-b border-white/10 flex flex-col md:flex-row md:justify-between gap-4">

    <div>
      <h1 class="text-2xl font-bold text-[#0AF748]" style="padding-bottom: 20px;">
        TEAM - Slots
      </h1>
      
      <p class="text-white/60 text-sm">
        Within the next 24hrs of your payment, your registration will be approved by the admins, if your team slot does not show up contact us on <a href="https://www.instagram.com/novus.mrdu/" target="_blank" class="text-[#0AF748] hover:underline">Instagram</a>
      </p>
    </div>

    <div class="flex items-center gap-6">
      <div class="text-sm">
        <span class="text-white/60">Slots Filled:</span>
        <span id="slotCount" class="font-bold text-[#0AF748]">0</span>
      </div>

      <button
        onclick="loadSlots()"
        class="border border-white/20 px-4 py-2 rounded hover:bg-white/10 transition">
        Refresh
      </button>
    </div>

  </header>

  <!-- MAIN -->
  <main class="p-6">

    <!-- STATUS -->
    <div id="status"
      class="mb-6 text-center text-white/60">
      Loading approved teams...
    </div>

    <!-- GRID -->
    <div
      id="list"
      class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="p-6 border-t border-white/10 text-center text-sm text-white/40">
    <!-- © THE NOVUS Hackathon • Live Slots Board -->
  </footer>

<script>
const API =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    // ? "backend_server"
    // : "backend_server";


async function loadSlots() {
  const status = document.getElementById("status");
  const list = document.getElementById("list");
  const slotCount = document.getElementById("slotCount");

  status.textContent = "Loading approved teams...";
  list.innerHTML = "";

  try {
    const res = await fetch(API);
    const teams = await res.json();

    slotCount.textContent = teams.length;

    if (!teams.length) {
      status.textContent = "No teams approved yet.";
      return;
    }

    status.textContent = "";

    teams.forEach((t, index) => {
      const card = document.createElement("div");

      card.className =
        "border border-white/10 rounded-xl bg-white/5 p-5 hover:bg-white/10 transition transform hover:-translate-y-1";

      card.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-lg font-bold text-[#0AF748]">
            ${t.teamName}
          </h3>

          <span class="text-xs px-2 py-1 rounded bg-white/10">
            #${index + 1}
          </span>
        </div>

        <p class="text-sm text-white/70">
          ${t.college}
        </p>

        <p class="text-sm text-white/50 mb-3">
          ${t.leader?.roll}
        </p>

        <div class="border-t border-white/10 pt-3 mt-3 text-sm">
          Leader:
          <span class="font-semibold">
            ${t.leader?.name || "-"}
          </span>
        </div>
      `;

      list.appendChild(card);
    });

  } catch (err) {
    status.textContent = "Failed to load slots.";
  }
}

/* Auto refresh every 15 sec */
setInterval(loadSlots, 15000);

/* Initial load */
loadSlots();
</script>

</body>
</html>
