<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVUS — Team Registration</title>
<link rel="icon" href="public/favicon.ico" type="image/x-icon">
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: "#0AF748",
            darkbg: "#020F18"
          }
        }
      }
    }
  </script>

  <!-- Animations -->
  <style>
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-animate {
      animation: slideIn 0.6s ease-out;
    }
  </style>
</head>

<body class="bg-darkbg text-white min-h-screen">

<!-- ================= PAGE CONTENT ================= -->
<main class="pt-32 pb-20 step-animate">

  <!-- PROGRESS BAR -->
  <div class="max-w-4xl mx-auto px-6 mb-10">
    <div class="flex items-center justify-between gap-4">

      <div class="flex-1 text-center">
        <div class="h-2 rounded bg-white/20"></div>
        <p class="mt-2 text-sm text-gray-400">Register</p>
      </div>

      <div class="flex-1 text-center">
        <div class="h-2 rounded bg-white/20"></div>
        <p class="mt-2 text-sm text-gray-400">Rules</p>
      </div>

      <div class="flex-1 text-center">
        <div class="h-2 rounded bg-white/20"></div>
        <p class="mt-2 text-sm text-gray-400">Payment</p>
      </div>

    </div>
  </div>

  <!-- FORM -->
  <section class="max-w-4xl mx-auto px-6">

    <h1 class="text-4xl font-bold text-neon mb-8">
      Team Registration
    </h1>

    <form id="regForm" class="space-y-10">

      TEAM DETAILS
      <div class="bg-white/5 p-6 rounded-xl border border-white/10">
  <h2 class="text-xl mb-4">Team Details</h2>

  <input id="teamName" required
    placeholder="Team Name"
    class="w-full p-3 bg-black/40 rounded"/>

  <input id="college" required
    placeholder="College Name"
    class="w-full mt-4 p-3 bg-black/40 rounded"/>

  <!-- DEPARTMENT -->
  <input id="department" required
    placeholder="Department (eg: CSE, ECE, AI & DS)"
    class="w-full mt-4 p-3 bg-black/40 rounded"/>
</div>

      <!-- LEADER -->
      <div class="bg-white/5 p-6 rounded-xl border border-white/10">
        <h2 class="text-xl mb-4">Team Leader</h2>

        <div class="grid md:grid-cols-4 gap-4">
          <input id="leaderName" required placeholder="Name"
  class="p-3 bg-black/40 rounded"/>
<input id="leaderEmail" required placeholder="Email"
  class="p-3 bg-black/40 rounded"/>
<input id="leaderPhone" required placeholder="Phone"
  class="p-3 bg-black/40 rounded"/>
<input id="leaderRoll" required placeholder="Roll Number"
  class="p-3 bg-black/40 rounded"/>
<select id="leaderFood" required class="p-3 bg-black/40 rounded md:col-span-4">
  <option value="">Food Preference</option>
  <option value="veg">Veg</option>
  <option value="nonveg">Non‑Veg</option>
</select>

        </div>
      </div>

      <!-- MEMBERS -->
      <div class="bg-white/5 p-6 rounded-xl border border-white/10">
        <h2 class="text-xl mb-4">
          Team Members (Max 3 members)
        </h2>

        <div id="members" class="space-y-6"></div>

        <button type="button"
          onclick="addMember()"
          class="mt-4 text-neon underline">
          + Add Member
        </button>
      </div> 

      <!-- NEXT -->
      <button type="submit"
        class="w-full bg-neon text-black py-4 rounded-xl font-bold hover:scale-105 transition">
        Rules & Consent >
      </button>

    </form>

  </section>
</main>

<!-- ================= SCRIPT ================= -->

<script>
  let memberCount = 0;
  const MAX_MEMBERS = 3;
  const API_BASE =
  window.location.hostname === "localhost"
    // ? "http://localhost:5000"
    // : "backend_server";



  function addMember() {
    if (memberCount >= MAX_MEMBERS) {
      alert("Only 4 members total including leader are allowed.");
      return;
    }

    memberCount++;

    const wrapper = document.createElement("div");
    wrapper.className =
      "bg-black/40 p-4 rounded-lg border border-white/10 member-block";

    wrapper.innerHTML = `
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-semibold text-neon">Member ${memberCount}</h3>
        <button type="button"
          class="text-red-400 text-sm underline"
          onclick="removeMember(this)">
          Remove
        </button>
      </div>

      <div class="grid md:grid-cols-5 gap-4">
  <input required placeholder="Name" class="p-3 bg-black/40 rounded"/>
  <input required placeholder="Email" class="p-3 bg-black/40 rounded"/>
  <input required placeholder="Phone" class="p-3 bg-black/40 rounded"/>
  <input required placeholder="Roll Number" class="p-3 bg-black/40 rounded"/>

  <select required class="p-3 bg-black/40 rounded">
    <option value="">Food</option>
    <option value="veg">Veg</option>
    <option value="nonveg">Non‑Veg</option>
  </select>
</div>

    `;

    document.getElementById("members").appendChild(wrapper);
  }

  function removeMember(btn) {
    btn.closest(".member-block").remove();
    memberCount--;

    document.querySelectorAll(".member-block h3")
      .forEach((h, i) => h.innerText = `Member ${i + 1}`);
  }

  function isAllowedDomain(email) {
    return email.endsWith("@gmail.com") || email.endsWith("@outlook.com");
  }

  function isValidPhone(phone) {
    return /^[0-9]{10,15}$/.test(phone.replace("+", ""));
  }

  document.getElementById("regForm").addEventListener("submit", e => {
  e.preventDefault();

  // get elements properly
  const leaderName = document.getElementById("leaderName");
  const leaderEmail = document.getElementById("leaderEmail");
  const leaderPhone = document.getElementById("leaderPhone");
  const leaderRoll = document.getElementById("leaderRoll");
  const leaderFood = document.getElementById("leaderFood");

  if (!isAllowedDomain(leaderEmail.value))
    return alert("Use Gmail or Outlook email.");

  if (!isValidPhone(leaderPhone.value))
    return alert("Invalid phone number.");

  if (!leaderFood.value)
    return alert("Please select the food preference for the team leader.");

  const members = [];

  document.querySelectorAll(".member-block").forEach(row => {
    const inputs = row.querySelectorAll("input");
    const select = row.querySelector("select");

    members.push({
      name: inputs[0].value,
      email: inputs[1].value,
      phone: inputs[2].value,
      roll: inputs[3].value,
      food: select.value
    });
  });

  const data = {
    teamName: teamName.value.trim(),
    college: college.value.trim(),
    department: department.value.trim(),

    leader: {
      name: leaderName.value,
      email: leaderEmail.value,
      phone: leaderPhone.value,
      roll: leaderRoll.value,
      food: leaderFood.value
    },

    members
  };

  fetch(`${API_BASE}/api/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(result => {

    // ✅ IMPORTANT FIX
    if (!result.team?._id) {
      alert(result.message || "Registration failed");
      return;
    }

    console.log("Saved:", result.team);

    localStorage.setItem("teamId", result.team._id);
    localStorage.setItem("teamData", JSON.stringify(result.team));

    window.location.href = "Rules.html";
  })
  .catch(err => {
    alert("Registration failed");
    console.error(err);
  });
  fetch(`${API_BASE}/api/register`, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(data)
})
.then(res => res.json())
.then(result => {

  // correct response handling
  if (!result.team?._id) {
    alert(result.message || "Registration failed");
    return;
  }

  console.log("Saved:", result.team);

  localStorage.setItem("teamId", result.team._id);
  localStorage.setItem("teamData", JSON.stringify(result.team));

  window.location.href = "Rules.html";
})
.catch(err => {
  alert("Registration failed");
  console.error(err);
});

});


</script>

<!-- COMPONENTS -->
<script type="module">
  import { loadNavbar } from "../components/Navbar.js";
  import { loadFooter } from "../components/Footer.js";
  import { showPageLoader } from "../components/PageLoader.js";

  loadNavbar();
  loadFooter();

  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", e => {
      if (link.href) {
        e.preventDefault();
        showPageLoader();
        setTimeout(() => {
          window.location.href = link.href;
        }, 500);
      }
    });
  });
</script>


</body>
</html>
